[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.13"

via_ir = true
optimizer = true
optimizer_runs = 200
no_match_contract = "CommandBuilderHarness"

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000
max_test_rejects = 65536

[invariant]
runs = 256
depth = 15
fail_on_revert = false
call_override = false
